# Who's That Pokémon — nginx site config.
#
# For a box that already runs nginx, so the bundled Caddy profile is not used.
# Copy to /etc/nginx/sites-available/whos-that-pokemon.conf, symlink into
# sites-enabled, then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Get the certificate first:
#   sudo certbot --nginx -d pokedraw.example.com
#
# Replace pokedraw.example.com throughout, and 8000 if you set WTP_PORT.

server {
    listen 80;
    listen [::]:80;
    server_name pokedraw.example.com;

    # certbot needs this reachable; everything else goes to HTTPS.
    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name pokedraw.example.com;

    ssl_certificate     /etc/letsencrypt/live/pokedraw.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pokedraw.example.com/privkey.pem;

    # A drawing is a 800x800 PNG, typically 100-400 KB. This is headroom; the
    # app itself rejects anything over 4 MB.
    client_max_body_size 8m;

    # This hostname is shown to every player before a match (scope 8.3), so do
    # not advertise the stack behind it.
    server_tokens off;

    access_log /var/log/nginx/whos-that-pokemon.access.log;
    error_log  /var/log/nginx/whos-that-pokemon.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;

        # Both of these are load-bearing, not boilerplate:
        #
        #   X-Forwarded-Proto  -> the app sets the Secure cookie flag from it.
        #                         Omit it and every session cookie goes out
        #                         without Secure, over HTTPS, silently.
        #   X-Forwarded-For    -> the login rate limiter buckets on client IP.
        #                         Omit it and all players share one bucket, so
        #                         one person fat-fingering a password locks
        #                         everybody out for five minutes.
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
    }

    location /images/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Deliberately NO add_header here. The app already sets
        #   Cache-Control: public, max-age=31536000, immutable
        #   Access-Control-Allow-Origin: *
        #   Content-Type: image/png
        # as part of the scope 8.2 contract that Trivia Tricks relies on.
        # Adding your own cache or CORS headers here overrides them and is a
        # silent regression — `python -m app.cli preflight` will catch it.
        proxy_hide_header X-Powered-By;
    }
}
